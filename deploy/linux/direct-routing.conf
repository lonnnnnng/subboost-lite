[Service]
# long: 仅在宿主机开启 TUN 且确认 5280 优先级空闲后安装此可选片段。
# systemd 的 + 前缀只提升路由准备/回收命令，Web 与 Mihomo 仍使用非 root 账号。
ExecStartPre=+/bin/sh /opt/subboost-lite/current/deploy/linux/direct-routing.sh add
ExecStopPost=+/bin/sh /opt/subboost-lite/current/deploy/linux/direct-routing.sh delete
# long: UID 绕过 TUN 后不能再使用宿主机的 Fake-IP DNS，只在本服务的挂载命名空间替换 resolv.conf。
BindReadOnlyPaths=/etc/subboost-lite-resolv.conf:/etc/resolv.conf
